<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHSMS Financial Ledger Prototype</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card: #ffffff;
            --primary: #2c3e50;
            --success: #27ae60;
            --danger: #e74c3c;
            --border: #dcdde1;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--primary); padding: 40px; margin: 0; }
        .container { max-width: 900px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* The Balance Card (The Jar) */
        .balance-card { background: var(--primary); color: white; padding: 30px; border-radius: 12px; text-align: center; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .balance-amount { font-size: 48px; font-weight: bold; }
        .balance-label { text-transform: uppercase; letter-spacing: 1px; font-size: 14px; opacity: 0.8; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
        h3 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-size: 16px; color: #7f8c8d; }

        /* Forms */
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; }
        .btn-in { background: var(--success); }
        .btn-out { background: var(--danger); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--bg); }
        .amount-in { color: var(--success); font-weight: bold; }
        .amount-out { color: var(--danger); font-weight: bold; }
        
        .rule-badge { background: #e8f4fd; color: #2980b9; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1 style="margin:0">Student A's Account</h1>
            <span class="rule-badge">FINANCIAL ALLOCATION: $50.00 / Month (The Rule)</span>
        </div>
        <div style="text-align: right">
            <small>Status: <strong>Active Sponsorship</strong></small>
        </div>
    </div>

    <!-- Tier 2: The Jar (Current Balance) -->
    <div class="balance-card">
        <div class="balance-label">Current Balance in Jar (Restricted)</div>
        <div class="balance-amount" id="totalBalance">$0.00</div>
    </div>

    <div class="grid">
        <!-- Input: Contribution -->
        <div class="card">
            <h3>Add Contribution (Money In)</h3>
            <div class="input-group">
                <label>Sponsor Name</label>
                <input type="text" id="inSponsor" value="John Doe">
            </div>
            <div class="input-group">
                <label>Amount (USD)</label>
                <input type="number" id="inAmount" value="50.00">
            </div>
            <button class="btn-in" onclick="addContribution()">Put Money in Jar</button>
        </div>

        <!-- Input: Payout -->
        <div class="card">
            <h3>Process Payout (Money Out)</h3>
            <div class="input-group">
                <label>Category</label>
                <input type="text" id="outDesc" value="June Tuition">
            </div>
            <div class="input-group">
                <label>Amount (USD)</label>
                <input type="number" id="outAmount" value="50.00">
            </div>
            <button class="btn-out" onclick="processPayout()">Spend Money from Jar</button>
        </div>
    </div>

    <div class="grid">
        <!-- Table: Contributions -->
        <div class="card">
            <h3>The Jar (CONTRIBUTIONS)</h3>
            <table id="tableContrib">
                <thead><tr><th>Date</th><th>Sponsor</th><th>Amount</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Table: Payouts -->
        <div class="card : impact-table">
            <h3>Impact (ALLOCATION_PAYOUTS)</h3>
            <table id="tablePayout">
                <thead><tr><th>Date</th><th>Description</th><th>Amount</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let balance = 0;

    function updateDisplay() {
        document.getElementById('totalBalance').innerText = `$${balance.toFixed(2)}`;
    }

    function addContribution() {
        const amt = parseFloat(document.getElementById('inAmount').value);
        const name = document.getElementById('inSponsor').value;
        if (isNaN(amt) || amt <= 0) return;

        balance += amt;
        const row = `<tr><td>${new Date().toLocaleDateString()}</td><td>${name}</td><td class="amount-in">+$${amt.toFixed(2)}</td></tr>`;
        document.querySelector('#tableContrib tbody').innerHTML += row;
        updateDisplay();
    }

    function processPayout() {
        const amt = parseFloat(document.getElementById('outAmount').value);
        const desc = document.getElementById('outDesc').value;
        
        if (isNaN(amt) || amt <= 0) return;
        if (amt > balance) {
            alert("Error: Not enough money in the student's jar!");
            return;
        }

        balance -= amt;
        const row = `<tr><td>${new Date().toLocaleDateString()}</td><td>${desc}</td><td class="amount-out">-$${amt.toFixed(2)}</td></tr>`;
        document.querySelector('#tablePayout tbody').innerHTML += row;
        updateDisplay();
    }
</script>

</body>
</html>
